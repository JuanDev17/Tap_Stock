<section class="household-setup">
  <h1>Welcome to TapStock</h1>
  <p>Set up your household to start managing groceries together.</p>

  <div class="household-actions">
    <button (click)="mode = 'create'">
      Create Household
    </button>

    <button (click)="mode = 'join'">
      Join Household
    </button>
  </div>

  @if (mode === 'create') {
    <!-- listening + passing event -->
    <app-household-signup [mode]="mode" (submitted)="createSubmit($event)"></app-household-signup>
  }

  @if (mode === 'join') {
      <!-- listening + passing event -->
    <app-household-signup [mode]="mode" (submitted)="joinSubmit($event)"></app-household-signup>
  }
</section>

@if (isLoading) {
  <p>Processing your request...</p>
}

@if (successMessage) {
  <p>{{ successMessage }}</p>
}

@if (errorMessage) {
  <p>{{ errorMessage }}</p>
}
