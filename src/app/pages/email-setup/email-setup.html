<section class="email-setup">
  <h1>Welcome to TapStock</h1>
  <p>Enter your email to receive a sign-in link.</p>

  <app-email-signup
    [disabled]="isLoading"
    (submitted)="emailSubmit($event)">
  </app-email-signup>

  @if (isLoading()) {
    <p role="status" aria-live="polite">Sending sign-in link...</p>
  }

  @if (successMessage()) {
    <p role="status" aria-live="polite">{{ successMessage() }}</p>
  }

  @if (errorMessage()) {
    <p role="alert">{{ errorMessage() }}</p>
  }
</section>
