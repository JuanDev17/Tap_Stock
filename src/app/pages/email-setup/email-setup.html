<section class="email-setup">
  <h1>Welcome to TapStock</h1>
  <p>Enter your email to receive a verification code.</p>

  <app-email-signup
    (submitted)="emailSubmit($event)">
  </app-email-signup>

  @if (isLoading) {
    <p>Sending verification code...</p>
  }

  @if (successMessage) {
    <p>{{ successMessage }}</p>
  }

  @if (errorMessage) {
    <p>{{ errorMessage }}</p>
  }
</section>
