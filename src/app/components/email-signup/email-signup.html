<form class="signup-form" [formGroup]="form" (ngSubmit)="submit()">

  <label for="email">Email Address</label>

  <input
    class="signup-input"
    id="email"
    type="email"
    formControlName="email"
    placeholder="you@example.com"
    autocomplete="email"
  />

  @if (form.controls.email.touched && form.controls.email.invalid) {
    <small class="form-error" role="alert">Please enter a valid email address.</small>
  }

  <button class="submit-button" type="submit" [disabled]="form.invalid || disabled">
    Continue
  </button>

</form>
