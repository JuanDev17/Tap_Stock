
name: Deploy TapStock

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --configuration production --base-href "/Tap_Stock_Ui-/"

      - name: Prepare deployment
        run: |
          BUILD_DIR=$(find dist -type f -name index.html -print -quit | xargs dirname)
          test -n "$BUILD_DIR"
          mkdir -p pages-artifact
          cp -R "$BUILD_DIR"/. pages-artifact/
          touch pages-artifact/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy
        uses: actions/deploy-pages@v4
