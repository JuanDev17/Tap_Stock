
name: Deploy TapStock

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build Tap-Stock --configuration production --base-href "/Tap_Stock_Ui-/"

      - name: Verify build
        run: |
          ls -la dist/Tap-Stock/browser
          test -f dist/Tap-Stock/browser/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/Tap-Stock/browser

      - name: Deploy
        uses: actions/deploy-pages@v4
