
name: Deploy TapStock

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build Tap-Stock --configuration production --base-href "/Tap_Stock/"

      - name: Add GitHub Pages route fallback
        run: cp dist/Tap-Stock/browser/index.html dist/Tap-Stock/browser/404.html

      - name: Verify build
        run: |
          ls -la dist/Tap-Stock/browser
          test -f dist/Tap-Stock/browser/index.html
          test -f dist/Tap-Stock/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: dist/Tap-Stock/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
