
name: Deploy TapStock to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npx ng build --configuration production --base-href "/YOUR-REPOSITORY-NAME/"

      - name: Prepare deployment files
        run: |
          mkdir -p pages-artifact

          if [ -d dist/YOUR-ANGULAR-PROJECT-NAME/browser ]; then
            cp -R dist/YOUR-ANGULAR-PROJECT-NAME/browser/. pages-artifact/
          else
            cp -R dist/YOUR-ANGULAR-PROJECT-NAME/. pages-artifact/
          fi

          touch pages-artifact/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload deployment artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
